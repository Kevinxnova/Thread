name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-repository.py --all-history
      - run: python3 scripts/test-repository-check.py
  macos-tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build.sh
